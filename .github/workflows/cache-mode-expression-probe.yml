name: Cache mode expression probe

on:
  push:
    branches:
      - codex/cache-mode-expression-probe-20260915

permissions: {}
cache-mode: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    cache-mode: ${{ github.event_name == 'push' && 'read' || 'none' }}
    steps:
      - name: Show effective cache mode
        run: echo "ACTIONS_CACHE_MODE=$ACTIONS_CACHE_MODE"
